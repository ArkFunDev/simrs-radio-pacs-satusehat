name: PHP lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo_mysql, mbstring

      - name: Syntax check (php -l)
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /tmp/out.txt 2>&1 || { cat /tmp/out.txt; fail=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit $fail

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Local secret files must not be tracked
        run: |
          if git ls-files | grep -E '(^|/)(config\.local\.php|\.env)$'; then
            echo "Secret file is tracked in git"; exit 1
          fi

      - name: TLS verification must not be disabled
        run: |
          if grep -rnE "VERIFYPEER'?\s*(=>|,)\s*false|VERIFYHOST'?\s*(=>|,)\s*0" --include='*.php' .; then
            echo "TLS verification disabled"; exit 1
          fi

      - name: display_errors must not be enabled
        run: |
          if grep -rnE "ini_set\('display_errors',\s*1\)" --include='*.php' .; then
            echo "display_errors enabled"; exit 1
          fi
